<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rakta Charitra</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00796b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rakta Charitra" />
  <link rel="apple-touch-icon" href="/icon.svg?v=2" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function() {
      try {
        var a = localStorage.getItem('appearance') || localStorage.getItem('theme') || 'auto';
        var s = localStorage.getItem('themeStyle') || 'material';
        var f = localStorage.getItem('fontFamily') || 'outfit';
        var h = new Date().getHours();
        var dark = a === 'dark' || (a === 'auto' && !(h >= 6 && h < 19));
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = s;
        document.documentElement.dataset.font = f;
        var acc = localStorage.getItem('accentColor');
        if (acc) document.documentElement.style.setProperty('--accent', acc);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=52" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">🩸</span>
      <span class="brand-name">Rakta Charitra</span>
    </div>
    
    <button data-view="household" class="nav-btn desktop-only" style="margin-bottom: 8px;"><span class="ico">🏠</span> Household</button>

    <div class="section-caption">Family</div>
    <nav id="member-nav" class="member-nav"></nav>
    <button id="add-member" class="ghost-btn">＋ Add family member</button>
    <div class="sidebar-footer">
      <button data-view="household" class="nav-btn mobile-only"><span class="ico">🏠</span> Household</button>
      <button data-view="upload" class="nav-btn"><span class="ico">＋</span> Add results</button>
      <button data-view="documents" class="nav-btn"><span class="ico">🗂</span> Documents</button>
      <button id="sidebar-lock-btn" class="nav-btn" style="display: none;"></button>
      <button id="theme-quick-btn" class="nav-btn"><span class="ico">🌓</span> <span class="theme-btn-label">Auto</span></button>
      <button data-view="settings" class="nav-btn"><span class="ico">⚙</span> Settings</button>
    </div>
  </aside>

  <main id="main" class="main"></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="/app.js?v=68"></script>

</body>
</html>
